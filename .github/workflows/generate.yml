name: Générer la carte souvenir
on:
  workflow_dispatch: {} # déclenché exclusivement par cron-job.org (toutes les 30 min)
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installer les dépendances
        run: npm install
      - name: Générer la carte
        run: npm run generate
      - name: Commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "Rien à committer" || git commit -m "Nouvelle carte $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
